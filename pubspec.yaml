name: bip39
description: Production-grade Flutter implementation of Bitcoin BIP39 mnemonic codes
version: 2.0.0
homepage: https://github.com/bulltechnologies/bip39
repository: https://github.com/bulltechnologies/bip39
issue_tracker: https://github.com/bulltechnologies/bip39/issues
license: BSD-3-Clause
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  native_crypto:
    git:
      url: https://github.com/bulltechnologies/native_crypto.git
      ref: b0a8a68b0d4510abfe8d3ed52c69f7209f22e780
  unorm_dart: ^0.3.0
  hex: ^0.2.0

flutter:
  assets:
    - test/vectors.json
    - test/japanese_vectors.json

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
