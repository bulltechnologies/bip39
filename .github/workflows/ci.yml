name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Private native dependencies are tested locally and in wallet_core's coordinated
# CI. This workflow intentionally requires no cross-repository credential.
jobs:
  source-checks:
    name: Source checks (no private dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"
      - name: Verify generated wordlists without resolving dependencies
        run: |
          dart tool/generate_wordlists.dart
          git diff --exit-code lib/src/wordlists/generated
      - name: Check native crypto source boundary
        run: bash tool/check_no_pure_dart_crypto.sh
